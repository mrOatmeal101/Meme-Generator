<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme Generator</title>
</head>
<h1>Meme Generator</h1>
<body>
    <h2>Fill out the form to start creating memes!</h2>
    <form>
    <div>
        <label for="topText">Link for Image</label>
        <input type="text" id="memeImg" placeholder="What's the URL for your meme image?">
    </div>
    <div>
        <label for="topText">Text for Top</label>
        <input type="text" id="topText" placeholder="(Optional) What text do you want at the top of the meme?">
    </div>
    <div>
        <label for="bottomText">Text for Bottom</label>
        <input type="text" id="bottomText" placeholder="(Optional) What text do you want at the bottom of the meme?">
    </div>
        <button>Add Meme</button>
    </form>
    
</body>
<script src="meme.js"></script>
</html>
