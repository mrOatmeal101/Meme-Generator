<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme Generator</title>
    <link rel="stylesheet" href="meme.css">
</head>

<body>
    <div class="container">
    <div>
        <input type="checkbox" id="switch"><label for="switch" class="toggle-container">Toggle</label>
    </div>

    <h1>
        <span class="letter "big">M</span>
        <span class="letter "big">e</span>
        <span class="letter "big">m</span>
        <span class="letter "big">e</span>
        <span class="space"> </span>
        <span class="letter "big">G</span>
        <span class="letter "big">e</span>
        <span class="letter "big">n</span>
        <span class="letter "big">e</span>
        <span class="letter "big">r</span>
        <span class="letter "big">a</span>
        <span class="letter "big">t</span>
        <span class="letter "big">o</span>
        <span class="letter "big">r</span>
    </h1>
    <h2>Fill out the form to start creating memes!</h2>
    <div class="memeForm">
        <form id="meme-Generator">
        <!-- <ul> -->
        <label for="memeImg" class="user-input-label">Link for Image:
            <input type="text" id="memeImg" class="user-input" placeholder="What's the URL for your meme image?">
        </label>
            
            
        <label for="topText" class="user-input-label">Text for Top: 
            <input type="text" id="topText" class="user-input" placeholder="(Optional) What text do you want at the top of the meme?">
        </label>
            
            
        <label for="bottomText" class="user-input-label">Text for Bottom: 
             <input type="text" id="bottomText" class="user-input" placeholder="(Optional) What text do you want at the bottom of the meme?">
        </label>
            
        <!-- </ul> -->
            <button type="submit">Add Meme</button>
        </form>
    </div>
</div>

    <div id="results">

    </div>

  
    <script src="meme.js"></script>
</body>

</html>
