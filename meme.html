<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme Generator</title>
    <link rel="stylesheet" href="meme.css">
</head>

<body>
    <h1>
        <span class="letter "big">M</span>
        <span class="letter "big">e</span>
        <span class="letter "big">m</span>
        <span class="letter "big">e</span>
        <span class="space"> </span>
        <span class="letter "big">G</span>
        <span class="letter "big">e</span>
        <span class="letter "big">n</span>
        <span class="letter "big">e</span>
        <span class="letter "big">r</span>
        <span class="letter "big">a</span>
        <span class="letter "big">t</span>
        <span class="letter "big">o</span>
        <span class="letter "big">r</span>
    </h1>
    <h2>Fill out the form to start creating memes!</h2>
    <div class="memeForm">
        <form id="meme-Generator">
        <ul>
            <li>
                <label for="memeImg">Link for Image:
                    <input type="text" id="memeImg" placeholder="What's the URL for your meme image?">
                </label>
            </li>
            <li>
                <label for="topText">Text for Top: 
                    <input type="text" id="topText" placeholder="(Optional) What text do you want at the top of the meme?">
                </label>
            </li>
            <li>
                <label for="bottomText">Text for Bottom: 
                    <input type="text" id="bottomText" placeholder="(Optional) What text do you want at the bottom of the meme?">
                </label>
        </ul>
            <button type="submit">Add Meme</button>
        </form>
    </div>
    <section id="results">

    </section>
    <script src="meme.js"></script>
</body>

</html>
